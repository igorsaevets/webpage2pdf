<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webpage2pdf</title>
    <style>
      :root { --bg:#0f0f12; --card:#1a1a1f; --fg:#e8e8ec; --muted:#9aa0a6; --accent:#7c5cf0; --border:#2a2a33; }
      * { box-sizing:border-box; margin:0; }
      body { width:340px; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; background:var(--bg); color:var(--fg); padding:16px; }
      h1 { font-size:15px; font-weight:700; display:flex; gap:8px; align-items:center; }
      .sub { color:var(--muted); font-size:12px; margin:4px 0 14px; line-height:1.4; }
      button { width:100%; background:var(--accent); color:white; border:0; border-radius:10px; padding:11px 14px; font-weight:600; cursor:pointer; font-size:14px; }
      button:disabled { opacity:.55; cursor:wait; }
      .hint { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.4; }
      .badge { font-size:10px; background:#2a2a33; border:1px solid var(--border); padding:2px 6px; border-radius:999px; }
      #log { margin-top:10px; font-size:11px; color:var(--muted); white-space:pre-wrap; word-break:break-word; max-height:140px; overflow:auto; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px; display:none; }
      #log.show { display:block; }
      .row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
      a { color:var(--accent); font-size:12px; text-decoration:none; }
      a:hover { text-decoration:underline; }
    </style>
  </head>
  <body>
    <h1>📄 webpage2pdf <span class="badge">desktop</span></h1>
    <p class="sub">Save this page as a desktop-layout PDF with selectable text.</p>
    <button id="btn">Save as PDF (desktop)</button>
    <div id="log"></div>
    <div id="hint" class="hint"></div>
    <div class="row">
      <a href="#" id="settingsLink">⚙️ Settings</a>
      <a href="#" id="openDownloads">📁 Downloads</a>
    </div>
    <p class="hint">The yellow “debugging this browser” bar is normal — leave it until the PDF finishes.</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
