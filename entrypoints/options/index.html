<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webpage2pdf — Настройки</title>
  <style>
    :root { --bg:#0f0f12; --card:#1a1a1f; --fg:#e8e8ec; --muted:#9aa0a6; --accent:#7c5cf0; --border:#2a2a33; --input:#23232a; }
    *{box-sizing:border-box;margin:0}
    body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg);color:var(--fg);padding:24px;max-width:560px;margin:0 auto}
    h1{font-size:18px;font-weight:700;margin-bottom:6px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.5}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
    .card h2{font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
    label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:13px;line-height:1.4}
    label input[type="radio"], label input[type="checkbox"]{margin-top:3px;accent-color:var(--accent)}
    .field{margin-top:10px}
    .field label{flex-direction:column;gap:6px}
    input[type="text"]{width:100%;background:var(--input);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:9px 10px;font-size:13px}
    input[type="text"]:disabled{opacity:.5}
    .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
    .row{display:flex;gap:10px;margin-top:16px}
    button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:13px}
    button.secondary{background:transparent;border:1px solid var(--border);color:var(--fg)}
    #status{font-size:12px;color:#22c55e;margin-left:10px;align-self:center;display:none}
    #status.show{display:block}
    code{background:#23232a;padding:1px 5px;border-radius:4px;font-size:11px}
    .warn{background:#3a2a0a;border:1px solid #6b4a0a;color:#facc15;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px;display:none}
    .warn.show{display:block}
  </style>
</head>
<body>
  <h1 data-i18n="optTitle">⚙️ webpage2pdf — Настройки</h1>
  <p class="sub" data-i18n="optSub">Бумага и куда сохранять PDF. Синхронизируется через Chrome Sync если включён.</p>

  <div class="card">
    <h2 data-i18n="optPaper">Формат бумаги</h2>
    <label><input type="radio" name="paper" value="a4" /> <span><b data-i18n="optA4">A4 (ISO)</b> — 210×297 mm</span></label>
    <label><input type="radio" name="paper" value="letter" /> <span><b data-i18n="optLetter">Letter (USA)</b> — 8.5×11″</span></label>
    <p class="hint">Scale: (paperWidth-0.8)*96/1920 to fit exactly.</p>
  </div>

  <div class="card">
    <h2 data-i18n="optSaveMode">Куда сохранять</h2>
    <label><input type="radio" name="saveMode" value="ask" /> <span data-i18n="optAsk"><b>Спрашивать каждый раз</b></span></label>
    <label><input type="radio" name="saveMode" value="downloads" /> <span data-i18n="optDownloads"><b>Авто в Загрузки</b></span></label>
    <div class="field" id="downloadsField">
      <label>
        <span data-i18n="optFolderInput">Подпапка в Загрузках (необязательно)</span>
        <input id="customDir" type="text" placeholder="webpage2pdf" />
      </label>
    </div>

    <label><input type="radio" name="saveMode" value="custom" /> <span data-i18n="optCustom"><b>Кастомный путь</b> — любая папка на диске (требует Native Host)</span></label>
    <div class="field" id="customField">
      <label>
        <span data-i18n="optCustomInput">Абсолютный путь к папке</span>
        <input id="customPath" type="text" placeholder="D:\MyPdfs" />
      </label>
      <div id="hostWarn" class="warn">⚠️ Native Host missing / save fallback to Downloads.</div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="optFilename">Имя файла</h2>
    <p class="hint">domain-yyyy-mm-dd.pdf</p>
  </div>

  <div class="row">
    <button id="save" data-i18n="btnSave">Сохранить</button>
    <button id="reset" class="secondary" data-i18n="btnReset">Сброс</button>
    <span id="status" data-i18n="optSaved">✓ Сохранено</span>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
